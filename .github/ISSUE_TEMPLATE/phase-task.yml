name: Phase task
description: Track one implementation phase or phase subtask
labels: ["phase-task"]
body:
  - type: input
    id: phase
    attributes:
      label: Phase
      placeholder: "Phase 00 — Repository Foundation"
    validations:
      required: true
  - type: textarea
    id: objective
    attributes:
      label: Objective
      description: What should be implemented?
    validations:
      required: true
  - type: textarea
    id: acceptance
    attributes:
      label: Acceptance criteria
      description: Checklist copied from the phase file.
    validations:
      required: true
  - type: textarea
    id: validation
    attributes:
      label: Validation commands
      description: Commands that must pass.
    validations:
      required: true
